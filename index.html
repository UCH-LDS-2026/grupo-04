<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mendoza Stock - Gestión de Inventario</title>
    <!-- CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📦 Mendoza Stock - Control de Inventario</span>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            
            <!-- FORMULARIO PARA AGREGAR PRODUCTO -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Agregar Nuevo Producto</h5>
                    </div>
                    <div class="card-body">
                        <form id="formProducto">
                            <div class="mb-3">
                                <label class="form-label">Nombre del Producto</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Ej: Teclado Logitech" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Precio ($)</label>
                                <input type="number" step="0.01" id="precio" class="form-control" placeholder="Ej: 25000" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Stock Inicial</label>
                                <input type="number" id="stock" class="form-control" placeholder="Ej: 10" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- TABLA DE PRODUCTOS -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Catálogo de Productos</h5>
                        <div>
                            <button id="btnTodos" class="btn btn-sm btn-outline-light me-1" onclick="cargarProductos()">Ver Todos</button>
                            <button id="btnAlertas" class="btn btn-sm btn-warning" onclick="cargarAlertas()">⚠️ Stock Crítico</button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                        <th>Estado</th>
                                        <th class="text-center">Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaProductos">
                                    <!-- Se llena automáticamente con JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT CONECTADO A LA API REST -->
    <script>
        const API_URL = "src/productos.php";

        // Cargar lista general
        async function cargarProductos() {
            try {
                const res = await fetch(API_URL);
                const productos = await res.json();
                renderTabla(productos);
            } catch (err) {
                console.error("Error cargando productos:", err);
            }
        }

        // Cargar solo stock crítico (?alertas=1)
        async function cargarAlertas() {
            try {
                const res = await fetch(`${API_URL}?alertas=1`);
                const productos = await res.json();
                renderTabla(productos);
            } catch (err) {
                console.error("Error cargando alertas:", err);
            }
        }

        // Renderizar la tabla HTML
        function renderTabla(productos) {
            const tbody = document.getElementById("tablaProductos");
            tbody.innerHTML = "";

            if (productos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3 text-muted">No hay productos para mostrar</td></tr>`;
                return;
            }

            productos.forEach(p => {
                const esCritico = parseInt(p.stock) <= 5;
                const badge = esCritico 
                    ? '<span class="badge bg-danger">Bajo Stock</span>' 
                    : '<span class="badge bg-success">OK</span>';

                tbody.innerHTML += `
                    <tr>
                        <td><strong>#${p.id}</strong></td>
                        <td>${p.nombre}</td>
                        <td>$${parseFloat(p.precio).toLocaleString('es-AR', {minimumFractionDigits: 2})}</td>
                        <td><strong>${p.stock}</strong> u.</td>
                        <td>${badge}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-primary" onclick="modificarStock(${p.id}, ${p.stock})">
                                ✏️ Stock
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // Función para editar el stock en tiempo real con validación de rango
        async function modificarStock(id, stockActual) {
            const nuevoStockStr = prompt("Ingresá la nueva cantidad de stock:", stockActual);
            
            if (nuevoStockStr === null || nuevoStockStr.trim() === "") return;

            const nuevoStock = parseInt(nuevoStockStr);
            
            // Validación de límites razonables para prevenir desbordamientos
            if (isNaN(nuevoStock) || nuevoStock < 0 || nuevoStock > 100000) {
                alert("Por favor, ingresá un número de stock válido entre 0 y 100.000.");
                return;
            }

            try {
                const res = await fetch(API_URL, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: id, stock: nuevoStock })
                });

                if (res.ok) {
                    cargarProductos(); // Recargar la tabla para actualizar la badge y la cifra
                } else {
                    alert("Error al actualizar el stock");
                }
            } catch (err) {
                console.error("Error enviando actualización:", err);
            }
        }

        // Agregar producto vía POST en formato JSON
        document.getElementById("formProducto").addEventListener("submit", async (e) => {
            e.preventDefault();

            const nuevoProducto = {
                nombre: document.getElementById("nombre").value,
                precio: parseFloat(document.getElementById("precio").value),
                stock: parseInt(document.getElementById("stock").value)
            };

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(nuevoProducto)
                });

                if (res.ok) {
                    document.getElementById("formProducto").reset();
                    cargarProductos(); // Recargar la tabla automáticamente
                } else {
                    alert("Error al guardar el producto");
                }
            } catch (err) {
                console.error("Error enviando datos:", err);
            }
        });

        // Cargar datos al abrir la página
        cargarProductos();
    </script>
</body>
</html>
